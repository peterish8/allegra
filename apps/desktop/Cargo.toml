[package]
name = "allegra-desktop"
version = "0.3.0"
edition = "2021"
description = "Allegra for Windows: the live site in a native WebView2 window."
license = "GPL-3.0-only"

[[bin]]
name = "allegra"
path = "src/main.rs"

[dependencies]
tao = "0.34"
wry = "0.53"
serde_json = "1"

# The same `windows` release wry already builds, so it compiles once.
[dependencies.windows]
version = "0.61"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Storage_EnhancedStorage",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_DataExchange",
    "Win32_System_Registry",
    "Win32_System_Variant",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
]

[build-dependencies]
winresource = "0.1"

[profile.release]
strip = true
lto = true
