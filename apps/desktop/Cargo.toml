[package]
name = "allegra-desktop"
version = "0.1.0"
edition = "2021"
description = "Allegra for Windows: the live site in a native WebView2 window."
license = "GPL-3.0-only"

[[bin]]
name = "allegra"
path = "src/main.rs"

[dependencies]
tao = "0.34"
wry = "0.53"

[dependencies.windows-sys]
version = "0.59"
features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Dwm",
]

[build-dependencies]
winresource = "0.1"

[profile.release]
strip = true
lto = true
