name: Mobile APK

# Builds the LuvLyrics APK on pushes that touch the app (or by hand from the
# Actions tab). Only main publishes to the "apk-latest" release, so a feature
# branch cannot replace the public download before the backend and site are ready.
# One link always has the newest main build — the one the app's own updater reads
# (apps/mobile/src/services/appUpdate.ts):
#   https://github.com/<owner>/<repo>/releases/download/apk-latest/LuvLyrics.apk

on:
  push:
    branches: [main, feat/connect-and-sync]
    paths:
      - "apps/mobile/**"
      - "packages/**"
      - "convex/_generated/**"
      - ".github/workflows/mobile-apk.yml"
      - "!apps/mobile/**/*.md"
      - "!apps/mobile/docs/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-apk
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/mobile

jobs:
  apk:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install
        run: npm ci

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Release builds are signed with android/app/debug.keystore (gitignored).
      # Android only installs an update over an app signed with the same key, so:
      #   1. the repo secret ANDROID_DEBUG_KEYSTORE_BASE64 (base64 of the local
      #      apps/mobile/android/app/debug.keystore) wins if set;
      #   2. otherwise the keystore from Expo's SDK 54 template — the one
      #      `expo prebuild` puts in every project, so it matches local builds.
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          KEY="$GITHUB_WORKSPACE/apps/mobile/android/app/debug.keystore"
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > "$KEY"
            echo "Using the keystore from the ANDROID_DEBUG_KEYSTORE_BASE64 secret"
          else
            mkdir -p /tmp/tpl && cd /tmp/tpl
            npm pack expo-template-bare-minimum@sdk-54 --silent
            tar -xzf expo-template-bare-minimum-*.tgz package/android/app/debug.keystore
            cp package/android/app/debug.keystore "$KEY"
            echo "Using the Expo SDK 54 template keystore"
          fi

      - name: Build release APK
        working-directory: apps/mobile/android
        env:
          # No Sentry auth token in CI: skip the source-map upload step.
          SENTRY_DISABLE_AUTO_UPLOAD: "true"
          EXPO_PUBLIC_SENTRY_DSN: ${{ secrets.EXPO_PUBLIC_SENTRY_DSN }}
          EXPO_PUBLIC_GENIUS_ACCESS_TOKEN: ${{ secrets.EXPO_PUBLIC_GENIUS_ACCESS_TOKEN }}
        # gradlew was committed without the executable bit. gradle.properties caps
        # the JVM at 2 GB, which leaves R8 thrashing; runners have 16 GB. arm64
        # only: the 32-bit copy of every native library added 23.5 MB.
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon \
            -PreactNativeArchitectures=arm64-v8a \
            "-Dorg.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError"

      - name: Collect APK
        run: cp android/app/build/outputs/apk/release/app-release.apk LuvLyrics.apk

      - uses: actions/upload-artifact@v4
        with:
          name: LuvLyrics-apk
          path: apps/mobile/LuvLyrics.apk
          retention-days: 14

  publish:
    name: Publish main APK
    if: github.ref == 'refs/heads/main'
    needs: apk
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: LuvLyrics-apk
          path: apps/mobile

      - name: Publish to the apk-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest LuvLyrics.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "LuvLyrics — latest build" \
            --notes "Built from \`${GITHUB_REF_NAME}\` at ${GITHUB_SHA::7}. Download LuvLyrics.apk below and open it on your Android phone to install. Direct link: https://github.com/${GITHUB_REPOSITORY}/releases/download/apk-latest/LuvLyrics.apk"
