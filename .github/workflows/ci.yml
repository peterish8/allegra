name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      # One install for every workspace — the same resolution the Vercel build uses,
      # so a dependency declared in the wrong place fails here and not in production.
      - name: Install
        run: npm ci
        env:
          # onnxruntime-node's postinstall only downloads the CUDA 12 GPU add-on on Linux (the CPU binaries ship in the
          # package). CI has no GPU, and that download from Microsoft's feed kept timing out and failing the install.
          ONNXRUNTIME_NODE_INSTALL: skip

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
