name: Mobile CI

# LuvLyrics (apps/mobile) has its own lockfile and is not a root workspace, so it
# gets its own install and checks. Runs only when the app, or code it imports
# from the rest of the repo, changes.

on:
  pull_request:
    paths:
      - 'apps/mobile/**'
      - 'packages/**'
      - 'convex/**'
      - '.github/workflows/mobile-*.yml'
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - 'packages/**'
      - 'convex/**'
      - '.github/workflows/mobile-*.yml'

permissions:
  contents: read

concurrency:
  group: mobile-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/mobile

jobs:
  checks:
    name: Secrets, lint, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # 22: the sync tests open a real SQLite database through node:sqlite, which Node 20 lacks.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install
        run: npm ci

      - name: Secret scan
        run: npm run security:secrets

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests with coverage
        run: npm run test:ci

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-coverage
          path: apps/mobile/coverage/
          retention-days: 7
