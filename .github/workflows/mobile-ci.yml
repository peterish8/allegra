name: Mobile CI

# LuvLyrics (apps/mobile) has its own lockfile and is not a root workspace, so it
# gets its own install and checks. Runs only when the app, or code it imports
# from the rest of the repo, changes.

on:
  pull_request:
    paths:
      - 'apps/mobile/**'
      - 'packages/**'
      - 'convex/**'
      - '.github/workflows/mobile-*.yml'
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - 'packages/**'
      - 'convex/**'
      - '.github/workflows/mobile-*.yml'

permissions:
  contents: read

concurrency:
  group: mobile-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/mobile

jobs:
  checks:
    name: Secrets, lint, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # 22: the sync tests open a real SQLite database through node:sqlite, which Node 20 lacks.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install
        run: npm ci

      - name: Secret scan
        run: npm run security:secrets

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests with coverage
        run: npm run test:ci

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mobile-coverage
          path: apps/mobile/coverage/
          retention-days: 7

  # The pure Kotlin rules (queue math, the island's geometry and timing, take-over, download receipts, the native
  # views' geometry) are JVM-tested in android/app/src/test. Nothing ran them in CI before, so a red test could sit
  # unnoticed for weeks (AppleBackdropGeometryTest did).
  kotlin:
    name: Kotlin unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      # Gradle resolves React Native, Expo and the native modules from node_modules.
      - name: Install
        run: npm ci

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Unit tests
        working-directory: apps/mobile/android
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest --no-daemon \
            -PreactNativeArchitectures=arm64-v8a \
            "-Dorg.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kotlin-unit-tests
          path: apps/mobile/android/app/build/reports/tests/testDebugUnitTest/
          retention-days: 7
