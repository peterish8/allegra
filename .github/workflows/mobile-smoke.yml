name: Mobile smoke test

# Boots the LuvLyrics release build on an Android emulator and drives it with
# lyricflow:// deep links (.github/scripts/mobile-android-smoke.sh): screenshots of
# launch, the player, Library and Settings, a background-playback check, the app's
# diagnostics and the JS / crash lines from logcat. Catches "installs fine, then
# blank screen" failures no unit test can. Results go to the "smoke-latest"
# release and a workflow artifact.

on:
  push:
    branches: [main]
    paths:
      - 'apps/mobile/src/**'
      - 'apps/mobile/android/**'
      - 'apps/mobile/index.ts'
      - 'apps/mobile/App.tsx'
      - 'apps/mobile/app.json'
      - 'apps/mobile/package.json'
      - 'apps/mobile/package-lock.json'
      - 'packages/**'
      - '.github/workflows/mobile-smoke.yml'
      - '.github/scripts/mobile-android-smoke.sh'
      - '.github/scripts/mobile-player-probe.sh'
      - '.github/scripts/player-assertions.sh'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mobile-smoke
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/mobile

jobs:
  smoke:
    name: Launch on emulator
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install
        run: npm ci

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Signing key
        run: |
          mkdir -p /tmp/tpl && cd /tmp/tpl
          npm pack expo-template-bare-minimum@sdk-54 --silent
          tar -xzf expo-template-bare-minimum-*.tgz package/android/app/debug.keystore
          cp package/android/app/debug.keystore "$GITHUB_WORKSPACE/apps/mobile/android/app/debug.keystore"

      # Same release build as the phone APK, but for the emulator's x86_64 CPU.
      - name: Build release APK (x86_64)
        working-directory: apps/mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon \
            -PreactNativeArchitectures=x86_64 \
            "-Dorg.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g"
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/apps/mobile/LuvLyrics-x86_64.apk"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Launch on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          working-directory: apps/mobile
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash ../../.github/scripts/mobile-android-smoke.sh LuvLyrics-x86_64.apk

      # On GLES the emulator deadlocks ~1s after opening Luvs (no app crash, qemu
      # idle): the main walk draws through Vulkan, and this short second boot
      # opens only Luvs on GLES as a canary for that emulator bug.
      - name: Luvs, second pass
        if: always()
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          working-directory: apps/mobile
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -show-kernel
          script: bash ../../.github/scripts/mobile-android-smoke.sh LuvLyrics-x86_64.apk luvs

      - name: Upload smoke results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-smoke
          path: apps/mobile/smoke/
          retention-days: 14

      - name: Publish screenshot and logcat
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f smoke/after-45s.png ] || exit 0
          find smoke -type f -size 0 -delete
          gh release delete smoke-latest --yes --cleanup-tag || true
          gh release create smoke-latest smoke/*.png smoke/*.txt \
            --prerelease --target "$GITHUB_SHA" \
            --title "Emulator smoke test — latest" \
            --notes "Launch, player (cover and lyrics), Library and Settings screenshots, background playback check, diagnostics and full logcat, from \`${GITHUB_REF_NAME}\` at ${GITHUB_SHA::7}."
          # gh publishes the draft after the uploads; once that step was lost and
          # the release stayed an untagged draft that no link could reach.
          if [ "$(gh release view smoke-latest --json isDraft -q .isDraft 2>/dev/null)" != "false" ]; then
            gh release edit smoke-latest --draft=false --tag smoke-latest || true
          fi
